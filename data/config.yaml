# webllm-agent configuration.
# providers: order = priority. 'model' is the model id at its gateway.
# kind: browser = chat page in your Chrome (via the bridge) | api = via OmniRoute.
# enabled: false hides a provider from '--to todas'.
omniroute:
  base_url: http://127.0.0.1:20128/v1
bridge:
  port: 20130
  timeout_s: 300
providers:
  qwen:
    model: browser/qwen
    kind: browser
    gateway: bridge
    timeout_s: 420
  deepseek:
    model: browser/deepseek
    kind: browser
    gateway: bridge
    timeout_s: 420
  zai-chat:
    model: browser/zai
    kind: browser
    gateway: bridge
    timeout_s: 420
  meta:
    model: browser/meta
    kind: browser
    gateway: bridge
    timeout_s: 420
  zai:
    model: zai/glm-4.7-flash
    kind: api
    enabled: true
    timeout_s: 180
  groq:
    model: groq/openai/gpt-oss-120b
    kind: api
    enabled: true
    timeout_s: 120
  nemotron:
    model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
    kind: api
    enabled: true
    timeout_s: 180
guard:
  min_spacing_s: 20
  daily_cap: 150
  cooldown_hours: 6
blocked_model_prefixes:
- codex/
- cx/
- cxa/
- cc/
- cgpt
- gpt-
blocked_model_substrings:
- claude
- anthropic
- chatgpt
- codex
web_model_prefixes:
- qwen-web/
- deepseek-web/
- ds-web/
- muse-spark-web/
- ms-web/
- zai-web/
- zw/
