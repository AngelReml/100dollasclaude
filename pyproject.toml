[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webllm-agent"
version = "0.1.0"
description = "Broadcast one prompt to several AI providers (web + API) through a local OmniRoute gateway."
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Only to run the tests (pydantic: the Open WebUI functions in openwebui/ use it; Open WebUI has it).
test = ["pytest>=8", "pydantic>=2"]

[project.scripts]
webllm = "webllm_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webllm_agent = ["*.html", "static/app/*", "static/app/assets/*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/golden"]
norecursedirs = ["sandbox-repo", "legacy", ".git", "data"]
asyncio_default_fixture_loop_scope = "function"
