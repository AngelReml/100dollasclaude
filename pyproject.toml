[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webllm-agent"
version = "0.1.0"
description = "Broadcast one prompt to several AI providers (web + API) through a local OmniRoute gateway."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.scripts]
webllm = "webllm_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
