<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fake chat</title>
<style>
  body { font: 16px system-ui; margin: 0; padding: 20px; }
  #log .msg { margin: 8px 0; padding: 8px; border: 1px solid #ccc; }
  textarea, [contenteditable] { width: 400px; min-height: 40px; border: 1px solid #888; display: block; }
</style></head>
<body>
<!-- A chat page nobody wrote selectors for. ?copy=0 removes the copy button,
     ?editable=1 uses a contenteditable box and Enter instead of a send button,
     ?login=1 shows a login wall instead of the chat, ?entrar=1 shows a login wall until someone clicks
     "Sign in" (Iván logging in; nothing is typed), then the chat, ?redirige=1 sends you to another address
     to log in (accounts.cuentas.test/signin/, like Google or Microsoft) and back, ?mudada=1 has moved to
     another address that is not a login page (nueva.test), ?nobox=1 has no text box at all,
     ?captcha=1 shows a slider verification after each message (except "pong") and only
     answers once someone clicks "Resolver" in it, ?lento=1 writes a long answer slowly and,
     like real chat sites, does not write while the page cannot be seen.
     Pages whose "stop" button misleads (Iván's Meta, 2026-09-25), all in Spanish:
     ?stopfijo=1 never removes "Detener" after the answer, ?stopfuera=1 moves it off-screen instead
     of removing it, ?clasestop=1 has a button whose class contains "stop" ("nonstop-toggle"), ?detenersiempre=1
     always shows a "Detener lectura en voz alta" button, even before anything is asked.
     ?completa=1 (PLAN-v5 F4) adds what real chats have: a model selector (menu), a "+" menu (upload, deep
     research, image), mode toggles (Pensar, Buscar en la web), a hidden file input that shows a chip per
     file and keeps each file's sha256 in window.__received, "Publicar" and "Compartir" buttons, and a
     download (blob) in each answer; the answer says which model, modes and files it got. Every click on the
     page is logged in window.__clicks. ?selectorroto=1: choosing a model does not change it.
     ?sinarchivos=1: no file input. ?modelooculto=1: the model selector is a nameless "⚙" (for "Enséñame").
     PLAN-v5 F6 (webs that change): ?extranjera=1 is a French page with a modern text box (contenteditable
     "plaintext-only", role textbox), "Envoyer", "Arrêter la génération", "Copier la réponse" and answers whose
     classes say nothing (layer 1 must find everything); ?rara=1 has answers with meaningless classes and no copy
     button (only a repair can read them: layer 3 or 4) and a sidebar with private chat titles (they must never
     leave the page); /codigo/ in the address makes the demo's repair AI answer with code (it must be refused).
     PLAN-v5 F7 (the same conversation): /conversa/ gives each conversation its own address (/conversa/c/<id>, set
     after the first message) and restores it when that address is opened again; an address it does not know sends
     you to a new chat (like real sites). Each answer says its turn: "Respuesta N a «…»". /conversa/tarda/: from the
     second turn on, it takes 15 s to start answering (like a model that thinks) and never shows a "stop" button.
     The same modes work as a path (/login/, /captcha/...): "+ Añadir otra IA" keeps only the path. -->
<div id="app"></div>
<script>
// Every click, by anyone (webllm included): the discovery must press no option.
window.__clicks = [];
document.addEventListener("click", (e) => {
  const el = e.target.closest("button,[role]") || e.target;
  window.__clicks.push((el.getAttribute("aria-label") || el.textContent || el.id || el.tagName).trim().slice(0, 40));
}, true);
window.__model = "Modelo Rápido";
window.__modes = {};
const modesOn = () => Object.keys(window.__modes).filter((m) => window.__modes[m]);
const setModo = (modo, on, name) => {
  window.__modes[modo] = on;
  const area = document.getElementById("modos");  // a chip per mode on, like real chats show
  if (area) area.innerHTML = Object.entries(window.__modes).filter(([, v]) => v).map(([k]) => `<span class="chip">${window.__modeNames[k]}</span>`).join(" ");
};
window.__modeNames = { pensar: "Pensar", buscar: "Buscar en la web", investigar: "Investigación profunda", imagen: "Crear imagen" };
function menu(trigger, items) {
  const m = document.createElement("div");
  m.setAttribute("role", "menu");
  m.style.cssText = "position:absolute;background:#fff;border:1px solid #999;padding:4px;z-index:5";
  for (const it of items) m.appendChild(it);
  const close = () => { m.remove(); trigger.setAttribute("aria-expanded", "false"); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape") close(); };
  trigger.onclick = () => {
    if (m.isConnected) return close();
    trigger.after(m);
    trigger.setAttribute("aria-expanded", "true");
    document.addEventListener("keydown", esc);
  };
  return close;
}
function full() {
  const q = new URLSearchParams(location.search);
  for (const m of ["selectorroto", "sinarchivos", "modelooculto"]) if (location.pathname.includes(`/${m}/`)) q.set(m, "1");
  const bar = document.createElement("div");
  bar.id = "herramientas";
  bar.innerHTML = (q.get("modelooculto") === "1" ? '<button id="modelo">⚙</button>' : '<button id="modelo" aria-haspopup="menu" aria-expanded="false"></button>') +
    '<button id="mas" aria-label="Adjuntar y más" aria-haspopup="menu" aria-expanded="false">+</button>' +
    '<button data-modo="pensar" aria-pressed="false">Pensar</button>' +
    '<button data-modo="buscar" aria-pressed="false">Buscar en la web</button>' +
    '<span id="modos"></span><span id="adjuntos"></span>' +
    (q.get("sinarchivos") === "1" ? "" : '<input type="file" id="archivos" multiple accept=".pdf,.txt,.bin,image/*" style="display:none">') +
    '<button id="publicar">Publicar</button><button aria-label="Compartir conversación">⤴</button>';
  document.getElementById("app").prepend(bar);
  const mb = document.getElementById("modelo");
  const label = () => { if (q.get("modelooculto") === "1") { mb.dataset.model = window.__model; mb.title = ""; } else mb.textContent = window.__model + " ▾"; };
  label();
  const models = ["Modelo Rápido", "Modelo Pro", "Modelo Ultra"].map((name) => {
    const o = document.createElement("div");
    o.setAttribute("role", "menuitemradio");
    o.textContent = name;
    o.onclick = () => { if (q.get("selectorroto") !== "1") window.__model = name; label(); closeModels(); };
    return o;
  });
  const closeModels = menu(mb, models);
  mb.addEventListener("click", () => models.forEach((o) => o.setAttribute("aria-checked", String(o.textContent === window.__model))), true);
  const item = (name, modo) => {
    const o = document.createElement("div");
    o.setAttribute("role", modo ? "menuitemcheckbox" : "menuitem");
    o.textContent = name;
    if (modo) {
      o.dataset.modo = modo;
      o.setAttribute("aria-checked", "false");
      o.onclick = () => { const on = o.getAttribute("aria-checked") !== "true"; o.setAttribute("aria-checked", String(on)); setModo(modo, on); };
    }
    else o.onclick = () => document.getElementById("archivos") && document.getElementById("archivos").click();
    return o;
  };
  menu(document.getElementById("mas"), [item("Subir archivo"), item("Investigación profunda", "investigar"), item("Crear imagen", "imagen")]);
  for (const t of document.querySelectorAll("button[data-modo]")) {
    t.onclick = () => { const on = t.getAttribute("aria-pressed") !== "true"; t.setAttribute("aria-pressed", String(on)); setModo(t.dataset.modo, on); };
  }
  const input = document.getElementById("archivos");
  if (input) input.addEventListener("change", async () => {
    window.__received = [];
    for (const f of input.files) {
      const sha = [...new Uint8Array(await crypto.subtle.digest("SHA-256", await f.arrayBuffer()))].map((b) => b.toString(16).padStart(2, "0")).join("");
      window.__received.push({ name: f.name, size: f.size, sha256: sha });
    }
    document.getElementById("adjuntos").innerHTML = [...input.files].map((f) => `<span class="chip">${f.name}</span>`).join(" ");
  });
}
// Tests can make the page "not seen", as Chrome reports it when the window is covered or
// minimized (headless Chromium never does): window.__setCovered(true / false).
let covered = false;
const realHidden = Object.getOwnPropertyDescriptor(Document.prototype, "hidden").get;
Object.defineProperty(document, "hidden", { configurable: true, get: () => covered || realHidden.call(document) });
window.__setCovered = (v) => { covered = v; document.dispatchEvent(new Event("visibilitychange")); };
const q = new URLSearchParams(location.search);
for (const m of ["completa", "selectorroto", "sinarchivos", "modelooculto", "login", "entrar", "redirige", "mudada", "nobox", "editable", "captcha", "lento", "stopfijo", "stopfuera", "clasestop", "detenersiempre", "extranjera", "rara", "conversa", "tarda"]) {
  if (location.pathname.includes(`/${m}/`)) q.set(m, "1");
}
const es = ["stopfijo", "stopfuera", "clasestop", "detenersiempre"].some((m) => q.get(m) === "1");
const fr = q.get("extranjera") === "1";
const rara = q.get("rara") === "1";
const app = document.getElementById("app");
// PLAN-v5 F7: conversations with their own address
const conv = q.get("conversa") === "1";
const convMatch = location.pathname.match(/^(.*\/)c\/(\w+)\/?$/);
const convBase = convMatch ? convMatch[1] : location.pathname.replace(/\/?$/, "/");
let convId = convMatch ? convMatch[2] : null;
const convLoad = (id) => { try { return JSON.parse(localStorage.getItem("conv:" + id) || "null"); } catch (e) { return null; } };
const convSave = (id, turns) => { try { localStorage.setItem("conv:" + id, JSON.stringify(turns)); } catch (e) { /* no storage */ } };
let convTurns = conv && convId ? convLoad(convId) : [];
const loggedIn = () => { try { return localStorage.getItem("fake-logged-in") === "1"; } catch (e) { return false; } };
if (q.get("logged") === "1") { try { localStorage.setItem("fake-logged-in", "1"); } catch (e) { /* stays out */ } }
if (location.pathname.includes("/signin/")) {  // the other address where you log in
  app.innerHTML = '<h1>Choose an account</h1><input type="password" id="password"><button id="signin">Sign in</button>';
  document.getElementById("signin").onclick = () => { location.href = q.get("back") + "?logged=1"; };
} else if (q.get("redirige") === "1" && !loggedIn()) {
  location.replace(`https://accounts.cuentas.test:${location.port}/signin/?back=${encodeURIComponent(location.origin + location.pathname)}`);
} else if (q.get("mudada") === "1") {
  location.replace(`https://nueva.test:${location.port}/`);
} else if (q.get("login") === "1" || (q.get("entrar") === "1" && !loggedIn())) {
  app.innerHTML = '<h1>Log in to continue</h1><input type="email" id="email"><input type="password" id="password"><button id="signin">Sign in</button>';
  document.getElementById("signin").onclick = () => {
    if (q.get("entrar") !== "1") return;
    try { localStorage.setItem("fake-logged-in", "1"); } catch (e) { /* no storage: stays logged out */ }
    location.reload();
  };
} else if (conv && convId && !convTurns) {  // a conversation this page does not have: a new chat
  location.replace(location.origin + convBase + location.search);
} else if (q.get("nobox") === "1") {
  app.innerHTML = '<h1>Welcome</h1><p>Download our app to chat.</p><button>Get the app</button>';
} else {
  app.innerHTML = (rara ? '<nav><button>Mi plan secreto de marketing</button><button>Receta de la abuela</button></nav>' : "") +
    '<div id="log"></div>' + (fr
    ? '<div id="box" contenteditable="plaintext-only" role="textbox" aria-label="Écrivez votre message"></div><button id="send" aria-label="Envoyer">➤</button>'
    : q.get("editable") === "1"
    ? '<div id="box" contenteditable="true" aria-label="Message"></div>'
    : `<textarea id="box" placeholder="Message"></textarea><button id="send" aria-label="${es ? "Enviar mensaje" : "Send message"}">➤</button>`);
  if (q.get("clasestop") === "1") app.insertAdjacentHTML("afterbegin", '<button class="nonstop-toggle">∞</button>');
  if (q.get("completa") === "1") full();
  if (q.get("detenersiempre") === "1") app.insertAdjacentHTML("afterbegin", '<button aria-label="Detener lectura en voz alta">🔇</button>');
  if (conv) {  // what was said before in this conversation, as the site shows it
    const log = document.getElementById("log");
    for (const t of convTurns || []) {
      log.insertAdjacentHTML("beforeend", `<div class="msg user">${t.u.replace(/</g, "&lt;")}</div><div class="msg assistant">${t.a}</div>`);
      const copy = document.createElement("button");
      copy.setAttribute("aria-label", "Copy response");
      copy.textContent = "⧉";
      copy.onclick = () => navigator.clipboard.writeText(t.a);
      log.appendChild(copy);
    }
  }
  const box = document.getElementById("box");
  const read = () => (box.value !== undefined ? box.value : box.innerText).trim();
  const clear = () => { if (box.value !== undefined) box.value = ""; else box.innerText = ""; };
  const ask = () => {
    const text = read();
    if (!text) return;
    clear();
    const log = document.getElementById("log");
    window.__stopped = false;
    log.insertAdjacentHTML("beforeend", `<div class="msg user">${text.replace(/</g, "&lt;")}</div>`);
    const turn = conv ? (convTurns || []).length + 1 : 0;
    if (conv && !convId) {  // the first message: the conversation gets its address
      convId = Math.random().toString(36).slice(2, 8);
      convTurns = [];
      history.replaceState(null, "", convBase + "c/" + convId + location.search);
    }
    const lateStart = conv && q.get("tarda") === "1" && turn >= 2;  // 15 s before answering (a model that thinks), no "stop"
    const stop = document.createElement("button");
    stop.setAttribute("aria-label", fr ? "Arrêter la génération" : es ? "Detener" : "Stop generating");
    stop.onclick = () => { window.__stopped = true; };
    stop.textContent = "■";
    if (!lateStart) document.body.appendChild(stop);
    const answer = document.createElement("div");
    answer.className = fr ? "zq9" : rara ? "x1 y2" : "msg assistant";
    log.appendChild(answer);
    const slow = q.get("lento") === "1" && !/pong/i.test(text);
    const got = q.get("completa") === "1" ? `modelo=${window.__model}; modos=${modesOn().join(",") || "ninguno"}; archivos=${(window.__received || []).map((f) => f.name).join(",") || "ninguno"}` : "";
    const words = /pong/i.test(text) ? ["**pong**"] : got ? ("Recibido: " + got).split(" ") : slow ? "esta respuesta tarda en escribirse del todo".split(" ")
      : conv ? `Respuesta ${turn} a «${text.slice(0, 40)}»`.split(" ") : ["hola", "qué", "tal"];
    let i = 0;
    const write = () => { const tick = setInterval(() => {
      if (slow && document.hidden) return;
      if (window.__stopped) { clearInterval(tick); stop.remove(); return; }  // the page's own stop button was pressed
      answer.innerHTML = words.slice(0, ++i).join(" ").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      if (i >= words.length) {
        clearInterval(tick);
        if (conv) { convTurns.push({ u: text, a: words.join(" ") }); convSave(convId, convTurns); }
        if (q.get("stopfuera") === "1") stop.style.cssText = "position:fixed;left:-10000px;top:0";
        else if (q.get("stopfijo") !== "1") stop.remove();
        if (q.get("copy") !== "0" && !rara) {
          const copy = document.createElement("button");
          copy.setAttribute("aria-label", fr ? "Copier la réponse" : es ? "Copiar respuesta" : "Copy response");
          copy.textContent = "⧉";
          copy.onclick = () => navigator.clipboard.writeText(words.join(" "));
          answer.after(copy);
        }
        if (got) {  // what the chat produced: a file made in the page
          const blob = new Blob(["Informe de prueba de webllm\n" + got + "\n"], { type: "text/plain" });
          answer.insertAdjacentHTML("beforeend", ` <a download="informe.txt" href="${URL.createObjectURL(blob)}">informe.txt</a>`);
          window.__lastDownload = "Informe de prueba de webllm\n" + got + "\n";
        }
      }
    }, slow ? 900 : 400); };
    if (q.get("captcha") === "1" && !/pong/i.test(text)) {
      const box = document.createElement("div");
      box.className = "captcha-box";
      box.style.cssText = "width:320px;height:90px;border:1px solid #888;margin:12px 0;padding:8px";
      box.innerHTML = 'Desliza para verificar <button id="solve">Resolver</button>';
      document.body.appendChild(box);
      document.getElementById("solve").onclick = () => { box.remove(); write(); };
    } else if (lateStart) {
      setTimeout(write, 15000);
    } else {
      write();
    }
  };
  const send = document.getElementById("send");
  if (send) send.onclick = ask;
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
}
</script>
</body>
</html>
