<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fake chat</title>
<style>
  body { font: 16px system-ui; margin: 0; padding: 20px; }
  #log .msg { margin: 8px 0; padding: 8px; border: 1px solid #ccc; }
  textarea, [contenteditable] { width: 400px; min-height: 40px; border: 1px solid #888; display: block; }
</style></head>
<body>
<!-- A chat page nobody wrote selectors for. ?copy=0 removes the copy button,
     ?editable=1 uses a contenteditable box and Enter instead of a send button,
     ?login=1 shows a login wall instead of the chat, ?nobox=1 has no text box at all,
     ?captcha=1 shows a slider verification after each message (except "pong") and only
     answers once someone clicks "Resolver" in it, ?lento=1 writes a long answer slowly and,
     like real chat sites, does not write while the page cannot be seen.
     Pages whose "stop" button misleads (Iván's Meta, 2026-09-25), all in Spanish:
     ?stopfijo=1 never removes "Detener" after the answer, ?stopfuera=1 moves it off-screen instead
     of removing it, ?clasestop=1 has a button whose class contains "stop" ("nonstop-toggle"), ?detenersiempre=1
     always shows a "Detener lectura en voz alta" button, even before anything is asked.
     The same modes work as a path (/login/, /captcha/...): "+ Añadir otra IA" keeps only the path. -->
<div id="app"></div>
<script>
// Tests can make the page "not seen", as Chrome reports it when the window is covered or
// minimized (headless Chromium never does): window.__setCovered(true / false).
let covered = false;
const realHidden = Object.getOwnPropertyDescriptor(Document.prototype, "hidden").get;
Object.defineProperty(document, "hidden", { configurable: true, get: () => covered || realHidden.call(document) });
window.__setCovered = (v) => { covered = v; document.dispatchEvent(new Event("visibilitychange")); };
const q = new URLSearchParams(location.search);
for (const m of ["login", "nobox", "editable", "captcha", "lento", "stopfijo", "stopfuera", "clasestop", "detenersiempre"]) {
  if (location.pathname.includes(`/${m}/`)) q.set(m, "1");
}
const es = ["stopfijo", "stopfuera", "clasestop", "detenersiempre"].some((m) => q.get(m) === "1");
const app = document.getElementById("app");
if (q.get("login") === "1") {
  app.innerHTML = '<h1>Log in to continue</h1><input type="email"><input type="password"><button>Sign in</button>';
} else if (q.get("nobox") === "1") {
  app.innerHTML = '<h1>Welcome</h1><p>Download our app to chat.</p><button>Get the app</button>';
} else {
  app.innerHTML = '<div id="log"></div>' + (q.get("editable") === "1"
    ? '<div id="box" contenteditable="true" aria-label="Message"></div>'
    : `<textarea id="box" placeholder="Message"></textarea><button id="send" aria-label="${es ? "Enviar mensaje" : "Send message"}">➤</button>`);
  if (q.get("clasestop") === "1") app.insertAdjacentHTML("afterbegin", '<button class="nonstop-toggle">∞</button>');
  if (q.get("detenersiempre") === "1") app.insertAdjacentHTML("afterbegin", '<button aria-label="Detener lectura en voz alta">🔇</button>');
  const box = document.getElementById("box");
  const read = () => (box.value !== undefined ? box.value : box.innerText).trim();
  const clear = () => { if (box.value !== undefined) box.value = ""; else box.innerText = ""; };
  const ask = () => {
    const text = read();
    if (!text) return;
    clear();
    const log = document.getElementById("log");
    log.insertAdjacentHTML("beforeend", `<div class="msg user">${text.replace(/</g, "&lt;")}</div>`);
    const stop = document.createElement("button");
    stop.setAttribute("aria-label", es ? "Detener" : "Stop generating");
    stop.textContent = "■";
    document.body.appendChild(stop);
    const answer = document.createElement("div");
    answer.className = "msg assistant";
    log.appendChild(answer);
    const slow = q.get("lento") === "1" && !/pong/i.test(text);
    const words = /pong/i.test(text) ? ["**pong**"] : slow ? "esta respuesta tarda en escribirse del todo".split(" ") : ["hola", "qué", "tal"];
    let i = 0;
    const write = () => { const tick = setInterval(() => {
      if (slow && document.hidden) return;
      answer.innerHTML = words.slice(0, ++i).join(" ").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      if (i >= words.length) {
        clearInterval(tick);
        if (q.get("stopfuera") === "1") stop.style.cssText = "position:fixed;left:-10000px;top:0";
        else if (q.get("stopfijo") !== "1") stop.remove();
        if (q.get("copy") !== "0") {
          const copy = document.createElement("button");
          copy.setAttribute("aria-label", es ? "Copiar respuesta" : "Copy response");
          copy.textContent = "⧉";
          copy.onclick = () => navigator.clipboard.writeText(words.join(" "));
          answer.after(copy);
        }
      }
    }, slow ? 900 : 400); };
    if (q.get("captcha") === "1" && !/pong/i.test(text)) {
      const box = document.createElement("div");
      box.className = "captcha-box";
      box.style.cssText = "width:320px;height:90px;border:1px solid #888;margin:12px 0;padding:8px";
      box.innerHTML = 'Desliza para verificar <button id="solve">Resolver</button>';
      document.body.appendChild(box);
      document.getElementById("solve").onclick = () => { box.remove(); write(); };
    } else {
      write();
    }
  };
  const send = document.getElementById("send");
  if (send) send.onclick = ask;
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
}
</script>
</body>
</html>
