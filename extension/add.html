<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webllm · Añadir una IA</title>
<style>
  :root { --bg:#f6f6f3; --card:#fff; --ink:#1b1b19; --ink2:#4f4f49; --line:#e3e3dd; --accent:#3a55d6; --accent-ink:#fff; --ok:#11621c; --bad:#a4262c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111110; --card:#1a1a19; --ink:#ecece8; --ink2:#b9b9b1; --line:#2f2f2c; --accent:#8ea5ff; --accent-ink:#0c1233; --ok:#86e08c; --bad:#ff9b9b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
         font:17px/1.55 "Segoe UI", system-ui, sans-serif; padding:16px; }
  main { max-width:560px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .url { font-family:Consolas, monospace; font-size:15px; color:var(--ink2); word-break:break-all; margin:0 0 18px; }
  p { margin:0 0 12px; }
  .muted { color:var(--ink2); font-size:15px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  button { font:inherit; font-weight:650; border-radius:12px; min-height:48px; padding:0 22px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #msg { margin-top:16px; font-weight:600; }
  #msg.ok { color:var(--ok); } #msg.bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Añadir <span id="name">esta IA</span> a webllm</h1>
  <p class="url" id="url"></p>
  <p>Para escribir en esta web y leer sus respuestas, webllm necesita tu permiso. Al pulsar el botón, Chrome te lo pedirá en un aviso: pulsa <b>Permitir</b>.</p>
  <p class="muted">El permiso es solo para esta web. webllm no lee tus contraseñas ni tus cookies, y nunca se salta una verificación.</p>
  <div class="row">
    <button id="go" class="primary">Permitir y probar</button>
    <button id="cancel">Cancelar</button>
  </div>
  <p id="msg" role="status"></p>
</main>
<script src="common.js"></script>
<script src="add.js"></script>
</body>
</html>
