# The web chats webllm knows (PLAN-v5 F3; the list is PLAN-v5 section 6). In git: what Iván did with each
# one (connected, not working yet and why, not wanted) lives in data/state/catalog_state.json.
# Addresses and notes were checked with a search engine on 2026-09-24/25. Whether each site works with
# webllm is only known on Iván's PC (from the cloud no real chat site can be opened).
#
# key       site key (the tab, the guard, the provider name); the built-in ones match extension/sites.js
# group     tuyas (already used) | 1 (plain chat, works from Spain) | 2 (preloaded as "puede fallar")
# account   si | no | opcional | desconocido (known once connected)
# private   false = what you write can be published or used by the site (never used by Automático or
#           the Committee; only when Iván picks it, and its name says so)
# daily_cap lower daily message cap than the guard's default (sites with few free messages)
checked: "2026-09-25"
